[project]
name = "aml"
version = "0.1.0"
description = "Détection LCB-FT en flux, frugale et explicable (IBM AML), avec rapports de type TRACFIN"
requires-python = ">=3.10"
# Inférence : numpy + le moteur C (compilé localement). Le reste est optionnel.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["polars>=1.0", "lightgbm>=4.0", "scikit-learn>=1.3"]
explain = ["lightgbm>=4.0"]
report = ["jinja2>=3.1"]
demo = ["rich>=13", "jinja2>=3.1", "markdown-it-py>=3", "lightgbm>=4.0"]
llm = ["llama-cpp-python>=0.3"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "models", "tools", "build", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
