[project]
name = "mlp"
version = "0.1.0"
description = "Détection LCB-FT par petit MLP sur les features de flux du moteur de arbre/ (IBM AML)"
requires-python = ">=3.10"
# Inférence : onnxruntime (ou numpy) sur le modèle exporté. L'entraînement demande torch.
dependencies = ["numpy>=1.24", "onnxruntime>=1.17"]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15", "duckdb>=1.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
